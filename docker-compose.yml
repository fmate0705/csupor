# Csupor Craft Beer — production stack for the Klivo Docker hosting platform.
#
# The platform runs this file verbatim after a strict security scan, and routes
# to the container through Traefik's file provider. That fixes three things:
#
#   * the container must be named `hosting_<slug>_web` — Traefik addresses it
#     by name, not by a published port;
#   * the ONLY network a site may join is its own `client_<slug>_net`, which is
#     external and created by the platform. Any other network is rejected —
#     that is how a site is kept off the shared platform/API network;
#   * no Docker labels, no privileged options, no host bind mounts.
#
# The slug here is `csupor`, matching /app/clients/csupor/sites/csupor.
#
# The app listens on 3000 (see Dockerfile). Set **container_port = 3000** for
# this site in the panel, otherwise Traefik will route to the platform default
# of 80 and get nothing.
#
# For local development use the override, which publishes a host port and swaps
# the external network for a local one:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build

services:
  hosting_csupor_web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hosting_csupor_web
    restart: unless-stopped

    # Secrets are injected at runtime, never baked into the image. The panel
    # writes this .env under Sites → site → Environment.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      DATA_DIR: /data

    # `expose`, not `ports`: Traefik reaches the container over the client
    # network by name. Publishing a host port would risk colliding with another
    # site on the same VPS.
    expose:
      - '3000'

    # The beer list must survive a redeploy. A *named* volume is required here —
    # the platform rejects host bind mounts.
    volumes:
      - csupor-data:/data

    networks:
      - client_csupor_net

    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # A single site must not be able to exhaust a shared host.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  csupor-data:
    name: csupor-data

networks:
  # Created and owned by the platform when the client is provisioned.
  client_csupor_net:
    external: true
