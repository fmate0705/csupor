metadata:
  description: >-
    Csupor Craft Beer Sorfozde is a small independent craft brewery, taproom and
    outdoor terrace venue in Hatvan, Hungary, brewing since 2014. Hospitality
    site for a restaurant-like local venue: it presents the rotating beer
    selection, tells the brewery story, and drives visits to the taproom with
    opening hours, location, maps directions and a click-to-call phone number.
    A small JWT-protected admin panel lets staff maintain the beer list.
